plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
}

version = project.mod_version
group = 'com.zennin'
base { archivesName = 'oneblock-lideres' }

repositories {
    mavenCentral()
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://artefacts.cobblemon.com/snapshots' }
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://maven.wispforest.io/releases' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.kotlin_fabric_version}"
    // Cobblemon solo para compilar: el modpack ya lo trae.
    modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
kotlin { jvmToolchain(21) }

jar {
    from('LICENCIA.txt')
}
