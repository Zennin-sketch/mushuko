<style>
/* Layout: lista de hechizos a la izquierda como paginas de grimorio, visor 3D grande a la derecha. Un solo look nocturno a proposito. */
:root {
  --bg: #12141c; --panel: #1b1e29; --line: #2c3142; --fg: #e9e6dc; --dim: #9a9db0;
  --gold: #d9b45a; --rune: #7fb6ff;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; height: 100%;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow-y: auto; }
h1 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; margin: 0; color: var(--gold); text-wrap: balance; }
.sub { color: var(--dim); margin: 0; line-height: 1.45; }
.list { display: flex; flex-direction: column; gap: 6px; }
.spell { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--fg);
  padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font: inherit; }
.spell:hover { border-color: #4a5170; }
.spell:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--rune); outline-offset: 2px; }
.spell[aria-pressed="true"] { border-color: var(--gold); background: #231f17; }
.spell b { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: .02em; }
.spell .el { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); align-self: center; }
.spell .ids { grid-column: 1 / -1; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.sec { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 4px 0 -4px; }
.note { border-top: 1px solid var(--line); padding-top: 10px; color: var(--dim); line-height: 1.5; }
.note h2 { font-family: var(--display); font-size: 13px; color: var(--fg); margin: 0 0 4px; letter-spacing: .05em; font-weight: 500; }
.note p { margin: 0; }
main { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0c0e14; }
canvas { display: block; width: 100%; height: 100%; }
.bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar button, .bar select { background: rgba(27,30,41,.92); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
.bar button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.bar label { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; background: rgba(27,30,41,.92); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.hud { position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 12px; color: var(--dim); background: rgba(12,14,20,.7); padding: 6px 8px; border-radius: 4px; }

  .wrap { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
  aside { overflow: visible; }
}

function showFade(g, t) {

const boltMat = new THREE.MeshBasicMaterial({ color: 0xe8f0ff, transparent: true, opacity: 0.95 });

function buildBolt(h) {

    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    bolt.add(m); p = q; r++;
  }
}

let cosChains = null;

const AX = new THREE.Vector3(1, 0, 0), AZ = new THREE.Vector3(0, 0, 1);
function chainQuads(c, side, t, hurt) {

  for (let i = 0; i <= n; i++) R.push(i === 0 ? frames[0] : i === n ? frames[n - 1] : frames[i - 1].clone().slerp(frames[i], 0.5));

  const ring = (i, w2, t2, off) => [[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx, sz]) =>

function updateCosChains(t) {

function show(name) {
