<style>

}

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }

#view canvas { display: block; width: 100%; height: 100%; outline: none; }
.hit { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-family: var(--display); letter-spacing: .2em;
  color: var(--ember); font-size: 13px; opacity: 0; transition: opacity .12s; pointer-events: none; text-shadow: 0 0 12px rgba(233,128,58,.6); }
.hit.on { opacity: 1; }
.cams { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; }
.cams button { font: 500 12px var(--body); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = /*__DATA__*/null;
const PI = Math.PI, D = PI / 180;

/* ================================================================ reproductor (copia de Player Animator) */
const PART_DEFAULTS = {
  head: [0,0,0], body: [0,0,0], torso: [0,0,0], rightItem: [0,0,0], leftItem: [0,0,0],
  rightArm: [-5,2,0], leftArm: [5,2,0], rightLeg: [-1.9,12,0.1], leftLeg: [1.9,12,0.1],
};
const ANGLES = new Set(['pitch','yaw','roll','bend','axis']);
const EASES = {
  LINEAR: t => t, CONSTANT: () => 0,
  INSINE: t => 1 - Math.cos(t * PI / 2), OUTSINE: t => Math.sin(t * PI / 2), INOUTSINE: t => -(Math.cos(PI * t) - 1) / 2,
  INQUAD: t => t * t, OUTQUAD: t => 1 - (1 - t) * (1 - t), INOUTQUAD: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  INCUBIC: t => t * t * t, OUTCUBIC: t => 1 - Math.pow(1 - t, 3), INOUTCUBIC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,

function easeOf(name) { let n = String(name || 'linear').toUpperCase(); if (n.startsWith('EASE')) n = n.slice(4); return EASES[n] || EASES.LINEAR; }
function clampRad(x) { const t = PI * 2; return ((x + PI) % t + t) % t - PI; }

function parseAnim(json) {
  const e = json.emote, version = json.version || 1;
  const degrees = e.degrees === undefined ? true : e.degrees === true || e.degrees === 'true';
  const A = { begin: e.beginTick || 0, end: e.endTick, stop: e.stopTick ?? e.endTick,
    loop: e.isLoop === true || e.isLoop === 'true', ret: e.returnTick || 0, easeBefore: !!e.easeBeforeKeyframe, axes: {} };
  for (const m of e.moves) {
    const tick = m.tick, ease = easeOf(m.easing), turn = m.turn || 0;

      const part = (version < 3 && k === 'torso') ? 'body' : k;
      for (const [ax, raw] of Object.entries(v)) {

        if (degrees && ang) val *= D;
        add(A, part, ax, tick, val, ease);

  }

}
function add(A, part, ax, tick, value, ease) {
  const key = part + '.' + ax; const list = A.axes[key] || (A.axes[key] = []);
  // igual que Player Animator: un keyframe en el mismo tick se agrega despues (asi funcionan los "turn")
  let i = list.length; while (i > 0 && list[i - 1].tick > tick) i--;
  list.splice(i, 0, { tick, value, ease });
}
function defaultOf(part, ax) {
  if (ax === 'x' || ax === 'y' || ax === 'z') { const d = PART_DEFAULTS[part] || [0,0,0]; return d['xyz'.indexOf(ax)]; }
  if (ax.startsWith('scale')) return 1;
  return 0;
}
class Player {
  constructor(anim) { this.a = anim; this.tick = 0; this.running = true; this.loopStarted = false; this.delta = 0; this.frac = 0; this.real = 0; this.cooldown = 0; }
  /** Velocidad como Better Combat: los ticks 0..impacto pasan en el 25% de la recarga, el resto se estira. */
  rate() {
    if (!this.cooldown) return 1;
    const S = this.a.end / this.cooldown, up = 0.25;
    if (this.real < this.cooldown * up) return 2 * S;
    if (this.real < this.cooldown) return (1 - up) * S;
    return S;
  }
  advance() {
    this.frac += this.rate(); this.real += 1;
    while (this.frac >= 1 && this.running) { this.frac -= 1; this.step(); }
  }
  step() {
    if (!this.running) return;
    this.tick++;
    if (this.a.loop && this.tick > this.a.end) { this.tick = this.a.ret; this.loopStarted = true; }
    if (this.tick >= this.a.stop) this.running = false;
  }
  value(part, ax, current) {
    const ang = ANGLES.has(ax);
    if (ang) current = clampRad(current);
    const keys = this.a.axes[part + '.' + ax];
    if (!keys || !keys.length || !this.running) return current;
    const v = this.axis(keys, defaultOf(part, ax), current);
    return ang ? clampRad(v) : v;
  }
  axis(keys, dflt, cur) {
    const a = this.a, t = this.tick;
    const findAt = tick => { let r = -1; for (let i = 0; i < keys.length; i++) if (keys[i].tick <= tick) r = i; return r; };
    const before = pos => {
      if (pos === -1) return t < a.begin ? { tick: 0, value: cur } : t < a.end ? { tick: a.begin, value: dflt } : { tick: a.end, value: dflt };
      const f = keys[pos];
      if (!a.loop && t >= a.end && pos === keys.length - 1 && f.tick < a.end) return { tick: a.end, value: f.value, ease: f.ease };
      return f;
    };
    const after = pos => {
      if (keys.length > pos + 1) return keys[pos + 1];
      if (a.loop) return { tick: a.end + 1, value: dflt };
      if (t < a.end && keys.length) { const l = keys[keys.length - 1]; return { tick: a.end, value: l.value, ease: l.ease }; }
      return t >= a.end ? { tick: a.stop, value: cur } : t >= a.begin ? { tick: a.end, value: dflt } : { tick: a.begin, value: dflt };
    };
    const pos = findAt(t);
    let b = before(pos);
    if (this.loopStarted && b.tick < a.ret) b = before(findAt(a.end));
    let f = after(pos);
    if (a.loop && f.tick > a.end) f = after(findAt(a.ret - 1));
    let tb = b.tick, ta = f.tick;
    if (tb >= ta) { if (t < tb) tb -= a.end - a.ret + 1; else ta += a.end - a.ret + 1; }
    if (tb === ta) return b.value;
    const x = (t + this.delta - tb) / (ta - tb);
    const from = a.easeBefore ? f : b;
    const e = (from.ease || EASES.LINEAR)(x);
    return b.value + (f.value - b.value) * e;
  }
}

/* ================================================================ escena */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0e1117);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e1117, 7, 16);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 12;
const CAMS = { '34': [-2.6, 1.7, -3.4], r34: [2.6, 1.5, -3.4], front: [0, 1.3, -4.2], side: [-4.2, 1.3, 0], back: [0, 1.6, 4.2], top: [0.01, 5.5, -0.6] };
let camKey = '34';
function cam(k) { camKey = k; const f = camera.aspect < 0.9 ? 1.6 : 1; camera.position.set(...CAMS[k].map((v, i) => i === 1 ? v : v * f)); controls.target.set(0, 0.95, 0); controls.update(); }
cam('34');
for (const k of Object.keys(CAMS)) document.getElementById('cam-' + k).onclick = () => cam(k);

scene.add(new THREE.HemisphereLight(0xfff2dc, 0x223044, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-3, 6, -4); scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fc6ff, 0.6); rim.position.set(3, 3, 5); scene.add(rim);

// suelo: baldosas de 1 bloque para leer distancias (el personaje mide 1.8 bloques)
{
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#28303a'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#222932'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  g.strokeStyle = '#323c48'; g.strokeRect(0.5, 0.5, 63, 63);
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(7, 7);
  tex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshLambertMaterial({ map: tex }));
  floor.rotation.x = -PI / 2; scene.add(floor);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.45, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .35 }));
  blob.rotation.x = -PI / 2; blob.position.y = 0.002; scene.add(blob);
  // marca de "adelante"
  const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 3), new THREE.MeshBasicMaterial({ color: 0xd9ab4e }));
  arrow.rotation.x = -PI / 2; arrow.position.set(0, 0.01, -1.1); scene.add(arrow);
}

/* ---------------------------------------------------------------- skin */
function defaultSkin() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const box = (u, v, w, h, d, col) => { // pinta todas las caras de una caja con un color por cara
    const [top, bottom, right, front, left, back] = col;
    g.fillStyle = top; g.fillRect(u + d, v, w, d); g.fillStyle = bottom; g.fillRect(u + d + w, v, w, d);
    g.fillStyle = right; g.fillRect(u, v + d, d, h); g.fillStyle = front; g.fillRect(u + d, v + d, w, h);
    g.fillStyle = left; g.fillRect(u + d + w, v + d, d, h); g.fillStyle = back; g.fillRect(u + 2 * d + w, v + d, w, h);
  };
  const skin = '#e8b994', hair = '#8a5a2b', robe = '#f1eee6', robe2 = '#d9d4c7', trim = '#7a2a2a', pants = '#3a3a48', boot = '#4a3324';
  box(0, 0, 8, 8, 8, [hair, skin, skin, skin, skin, hair]);
  g.fillStyle = hair; g.fillRect(8, 8, 8, 2); g.fillRect(0, 8, 8, 3); g.fillRect(16, 8, 8, 3); g.fillRect(24, 8, 8, 8);
  g.fillStyle = '#2b5f9e'; g.fillRect(9, 12, 2, 1); g.fillRect(13, 12, 2, 1); g.fillStyle = '#ffffff'; g.fillRect(10, 12, 1, 1); g.fillRect(13, 12, 1, 1);
  g.fillStyle = '#b07a5a'; g.fillRect(11, 14, 2, 1);
  box(16, 16, 8, 12, 4, [robe, robe, robe2, robe, robe2, robe2]);
  g.fillStyle = trim; g.fillRect(23, 20, 2, 12); g.fillRect(20, 20, 8, 1);
  box(40, 16, 4, 12, 4, [robe, skin, robe2, robe, robe2, robe2]); g.fillStyle = skin; g.fillRect(40, 28, 16, 4);
  box(32, 48, 4, 12, 4, [robe, skin, robe2, robe, robe2, robe2]); g.fillStyle = skin; g.fillRect(32, 60, 16, 4);
  box(0, 16, 4, 12, 4, [pants, boot, pants, pants, pants, pants]); g.fillStyle = boot; g.fillRect(0, 26, 16, 6);
  box(16, 48, 4, 12, 4, [pants, boot, pants, pants, pants, pants]); g.fillStyle = boot; g.fillRect(16, 58, 16, 6);
  return c;
}
const skinTex = new THREE.CanvasTexture(defaultSkin());
skinTex.magFilter = THREE.NearestFilter; skinTex.minFilter = THREE.NearestFilter; skinTex.colorSpace = THREE.SRGBColorSpace;
const skinMat = new THREE.MeshLambertMaterial({ map: skinTex, alphaTest: 0.5, side: THREE.DoubleSide });

/* ---------------------------------------------------------------- geometria tipo Minecraft */
function quad(pos, uv, verts, uvs) { // verts: TL, TR, BR, BL
  const [a, b, c, d] = verts, [ua, ub, uc, ud] = uvs;
  for (const [v, u] of [[a, ua], [b, ub], [c, uc], [a, ua], [c, uc], [d, ud]]) { pos.push(...v); uv.push(...u); }
}
function geom(pos, uv) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

/** Animar: genera todos los ticks entre keyframes (curva suave) y apoya el cuerpo en el piso (nada lo atraviesa). */
