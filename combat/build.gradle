plugins {
    id 'fabric-loom'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'mushoku-combat' }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // El mod principal (Mushoku Tensei): clases del jugador, clases de mago/espadachin y modo conjuro.
    implementation project(path: ':', configuration: 'namedElements')
    modCompileOnly("software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}") { transitive = false }
    // Player Animator (MIT) solo para compilar; en el juego lo trae el jugador junto con Better Combat.
    modCompileOnly files('libs/player-animation-lib-fabric-2.0.4+1.21.1.jar')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
