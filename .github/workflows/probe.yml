name: Buscar bendy-lib
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar jars
        run: |
          V=$(curl -sf https://maven.kosmx.dev/io/github/kosmx/bendy-lib/bendy-lib-fabric/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tr '\n' ' ')
          echo "::warning::versiones: $V"
          for v in 5.1 5.0; do
            if curl -sfL -o b.jar https://maven.kosmx.dev/io/github/kosmx/bendy-lib/bendy-lib-fabric/$v/bendy-lib-fabric-$v.jar; then
              D=$(unzip -p b.jar fabric.mod.json | tr -d '\n ' | grep -o '"depends":{[^}]*}')
              echo "::warning::$v -> $D"
            else echo "::warning::no hay jar $v"; fi
          done
