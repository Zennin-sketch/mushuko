name: Prueba visual
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Escenario (tools/visualtest/<nombre>.json)
        default: skinlayers
      jvm:
        description: Argumentos extra de Java
        default: ""
      tag:
        description: Rama de resultados (vt-<tag>)
        default: results
      exclude:
        description: Mods a sacar (parte del nombre del archivo)
        default: ""
      extras:
        description: Extras (fresh = EMF/ETF + Fresh Animations)
        default: ""

permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -x test
      - name: Preparar Minecraft
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install -q portablemc==4.4.1
          mkdir -p mc/mods
          portablemc --main-dir mc --work-dir mc start fabric:1.21.1:0.16.5 --dry
          cp $(ls build/libs/*.jar | grep -v sources) mc/mods/
          cp $(ls combat/build/libs/*.jar | grep -v sources) mc/mods/
          if [ -n "${{ inputs.exclude }}" ]; then rm -f mc/mods/*${{ inputs.exclude }}*; fi
          ls mc/mods
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\nrenderDistance:5\nsimulationDistance:5\njoinedFirstServer:true\nguiScale:2\npauseOnLostFocus:false\nnarrator:0\nsoundCategory_master:0.0\ngraphicsMode:1\n' > mc/options.txt
          python3 tools/visualtest/fetch_mods.py mc/mods "${{ inputs.extras }}"
          ls mc/mods mc/resourcepacks 2>/dev/null || true
      - name: Correr la prueba
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 1500 portablemc --main-dir mc --work-dir mc start fabric:1.21.1:0.16.5 -u Zennin --resolution 1280x720 \
            --jvm-args="-Xmx3G ${{ inputs.jvm }} -Dmushoku.visualtest=$PWD/tools/visualtest/${{ inputs.scenario }}.json" || true
          ls mc/screenshots || true
          grep -E "visualtest|Exception|ERROR" mc/logs/latest.log | head -80 || true
      - name: Subir capturas a la rama vt-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp mc/screenshots/*.png /tmp/res/ 2>/dev/null || true
          for z in mc/resourcepacks/*.zip; do [ -f "$z" ] && (mkdir -p /tmp/res/packs && cd /tmp/res/packs && unzip -qo "$OLDPWD/$z" '*player*' '*cem/*armor*' 2>/dev/null || true); done
          grep -E "visualtest|Exception|ERROR|Caused by|at net.zennin|skinlayers|Compatibilidad|capas" mc/logs/latest.log | head -300 > /tmp/res/log.txt || true
          cd /tmp/res
          git init -q && git checkout -q -b vt-${{ inputs.tag }}
          git config user.name "visualtest" && git config user.email "visualtest@users.noreply.github.com"
          echo "${{ inputs.scenario }} ${{ github.sha }}" > info.txt
          git add -A && git commit -q -m "Resultados ${{ inputs.scenario }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vt-${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualtest
          path: |
            mc/screenshots/*.png
            mc/logs/latest.log
