# Compila el mod en GitHub cada vez que subis un cambio. El .jar queda en la pestaña
# Actions > la ultima ejecucion > Artifacts > oneblock-lideres.
name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: compilar
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: oneblock-lideres
          path: build/libs/oneblock-lideres-*.jar
          if-no-files-found: error
