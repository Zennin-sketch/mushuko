name: Compilar mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Publica los errores como anotaciones para poder leerlos sin descargar el log
            grep -E -A2 "error:|What went wrong|Caused by" build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mushoku-tensei-fabric
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mushoku-combat
          path: combat/build/libs/*.jar
